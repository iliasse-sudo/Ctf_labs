x-challenge-defaults: &challenge-defaults
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  oopsie:
    <<: *challenge-defaults
    build: ./Oopsie
    ports:
      - "1338:1338"
    container_name: ctf_oopsie

  returnal:
    <<: *challenge-defaults
    build: ./Returnal
    ports:
      - "1339:1339"
    container_name: ctf_returnal

  r0p_me:
    <<: *challenge-defaults
    build: ./R0P_Me
    ports:
      - "1340:1340"
    container_name: ctf_r0p_me
