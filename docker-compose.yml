x-challenge-defaults: &challenge-defaults
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  oopsie:
    <<: *challenge-defaults
    build: ./Oopsie
    ports:
      - "1338:1338"
    container_name: ctf_oopsie

  returnal:
    <<: *challenge-defaults
    build: ./Returnal
    ports:
      - "1339:1339"
    container_name: ctf_returnal

  r0p_me:
    <<: *challenge-defaults
    build: ./R0P_Me
    ports:
      - "1340:1340"
    container_name: ctf_r0p_me

  blind_spot:
    <<: *challenge-defaults
    build: ./Blind_Spot
    ports:
      - "1341:1341"
    container_name: ctf_blind_spot

  house_of_calls:
    <<: *challenge-defaults
    build: ./House_of_Calls
    ports:
      - "1342:1342"
    container_name: ctf_house_of_calls

  final_payload:
    <<: *challenge-defaults
    build: ./Final_Payload
    ports:
      - "1343:1343"
    container_name: ctf_final_payload
